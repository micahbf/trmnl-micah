services:
  trmnl:
    build: .
    restart: unless-stopped
    env_file: .env          # GCAL_ICS_URLS, SCREEN_KEY, TZ_DISPLAY
    environment:
      HOST: 0.0.0.0         # inside the container; overrides .env
      PORT: 3000
    ports:
      # Host loopback only; Caddy proxies to it. Set HOST_PORT in .env to change
      # the host side. The container always listens on 3000.
      - "127.0.0.1:${HOST_PORT:-3000}:3000"
